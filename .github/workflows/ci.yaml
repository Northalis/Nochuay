name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ============================
  # Job 1: Backend (Go)
  # ============================
  backend:
    name: Backend Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./nochuay-back

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ./nochuay-back/go.mod
          cache-dependency-path: ./nochuay-back/go.sum
        env:
          GONOSUMDB: github.com/Northalis/Nochuay/nochuay-back
          GONOPROXY: github.com/Northalis/Nochuay/nochuay-back

      - name: Go Vet
        run: go vet ./...
        env:
          GONOSUMDB: github.com/Northalis/Nochuay/nochuay-back
          GONOPROXY: github.com/Northalis/Nochuay/nochuay-back

      - name: Go Test
        run: go test -v ./...
        env:
          GONOSUMDB: github.com/Northalis/Nochuay/nochuay-back
          GONOPROXY: github.com/Northalis/Nochuay/nochuay-back

      - name: Go Build
        run: go build -o bin/api ./cmd/api
        env:
          GONOSUMDB: github.com/Northalis/Nochuay/nochuay-back
          GONOPROXY: github.com/Northalis/Nochuay/nochuay-back

  # ============================
  # Job 2: Frontend (Next.js)
  # ============================
  frontend:
    name: Frontend Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./nochuay-front

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ./nochuay-front/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npx jest --roots ./test/frontend --verbose

  # ============================
  # Job 3: Docker Build
  # ============================
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Backend Docker image
        run: docker build -t nochuay-api:ci --target production ./nochuay-back

      - name: Verify Docker Compose config
        run: docker compose config --quiet
